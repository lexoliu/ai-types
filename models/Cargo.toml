[package]
name = "aither-models"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Model registry with capabilities, context windows, and metadata for popular LLMs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phaedrus-ai/aither"
readme = "../README.md"
keywords = ["llm", "ai", "models", "registry"]
categories = ["data-structures"]

[dependencies]
aither-core.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-fs = { version = "2", optional = true }
zenwave = { workspace = true, optional = true }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3"

[features]
default = []
remote = ["zenwave", "dep:async-fs"]
